server:
  port: 8081

spring:
  application:
    name: zhiyouxing-user
  config:
    import:
      - optional:nacos:zhiyouxing-user.yml
  cloud:
    nacos:
      # 服务端开了鉴权（compose 里 NACOS_AUTH_ENABLE=true），客户端不带凭据会被拒：401 User not found
      # 这两个全局键同时作用于 discovery 与 config，无需分别在各自节点下重复配置
      username: nacos
      password: nacos
      discovery:
        server-addr: 192.168.137.128:8848
        # Nacos 跑在 VM 里，未启动时不要因注册失败直接退出；服务照常起来并自动重试注册
        fail-fast: false
      config:
        server-addr: 192.168.137.128:8848
        file-extension: yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本机 MySQL（D:\MySQL）；VM 库是旧 schema、缺三张 *_staff 表，故改用本地。Redis/Nacos 仍在 VM
    url: jdbc:mysql://127.0.0.1:3306/zhiyouxing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 本机 MySQL 的 root 口令
    password: 123456
  data:
    redis:
      host: 192.168.137.128
      port: 6379
      # VM 里的 Redis 用 --requirepass 启的，不带密码会 NOAUTH
      password: 123456
      database: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
